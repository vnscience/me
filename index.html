<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Academic CV of Bay Nguyen-Van, lecturer and researcher in Computer Science, AI, and Machine Learning.">
    <title>Bay Nguyen-Van | Academic CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/main.css">
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav" aria-label="Primary navigation">
        <a class="brand" href="index.html" data-field="shortName">Bay Nguyen-Van</a>
        <div class="nav-links" id="navLinks"></div>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="profile-name">
        <div class="hero-copy">
          <p class="eyebrow" data-field="headline">Academic CV</p>
          <h1 id="profile-name" data-field="name">Bay Nguyen-Van</h1>
          <p class="lead" data-field="summary"></p>
          <div class="hero-actions" id="heroActions"></div>
        </div>
        <aside class="profile-panel" aria-label="Profile highlights">
          <img id="profilePhoto" alt="Bay Nguyen-Van portrait">
          <div class="quick-facts" id="quickFacts"></div>
        </aside>
      </section>

      <section class="section compact-section">
        <div class="section-heading">
          <p class="eyebrow">Profile</p>
          <h2>CV sections</h2>
        </div>
        <div class="page-grid" id="sectionCards"></div>
      </section>
    </main>

    <footer class="footer" id="contact">
      <div>
        <p class="eyebrow">Contact</p>
        <h2>Get in touch</h2>
      </div>
      <address id="contactList"></address>
      <div class="social-links" id="socialLinks"></div>
    </footer>

    <script src="assets/main.js"></script>
  </body>
</html>
